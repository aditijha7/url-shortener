<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Convert a long URL into a short, easy-to-share link.">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="shortener-card" aria-labelledby="page-title">
      <div class="link-icon" aria-hidden="true">↗</div>
      <h1 id="page-title">URL Shortener</h1>
      <p class="intro">Convert your long URL into a short and easy-to-share link.</p>

      <form id="shorten-form">
        <label for="long-url">Paste your long URL</label>
        <div class="input-row">
          <input
            id="long-url"
            name="long-url"
            type="url"
            placeholder="https://example.com/your/long/link"
            autocomplete="url"
            required
          >
          <button id="shorten-button" type="submit">Shorten URL</button>
        </div>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <section id="result" class="result hidden" aria-labelledby="result-title">
        <h2 id="result-title">Your shortened URL</h2>
        <div class="result-row">
          <a id="short-url" href="#" target="_blank" rel="noopener noreferrer"></a>
          <button id="copy-button" class="secondary-button" type="button">Copy</button>
        </div>
      </section>

      <p class="footer-note">Simple, quick, and free to use.</p>
    </section>
  </main>
</body>
</html>
